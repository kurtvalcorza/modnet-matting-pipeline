[project]
name = "modnet-matting-pipeline"
version = "0.1.0"
description = "DIMER pipeline for MODNet photographic portrait matting (ZHKKKe/MODNet, modnet_photographic_portrait_matting.ckpt): trimap-free alpha mattes, held-out evaluation against constant baselines, and bounded fine-tuning of the matting branches with a portable adapter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  # The upstream checkpoint is a legacy torch pickle; this package converts it once into safetensors (docs/WEIGHTS.md)
  # and runs the architecture vendored in src/modnet_matting_pipeline/modeling.py. Pillow reads and writes the
  # images and mattes; nothing here needs torchvision, scipy or a Hub-hosted module.
  "torch==2.14.0",
  "numpy==2.5.3",
  "pillow==11.3.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.32.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/modnet_matting_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tutorials"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
